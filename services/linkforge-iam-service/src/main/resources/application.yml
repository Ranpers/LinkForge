server:
  port: 9000

spring:
  application:
    name: linkforge-iam-service

  config:
    import:
      - optional:nacos:linkforge-common-${LINKFORGE_ENV:local}.yaml?group=${NACOS_CONFIG_GROUP:LINKFORGE}&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${LINKFORGE_ENV:local}.yaml?group=${NACOS_CONFIG_GROUP:LINKFORGE}&refreshEnabled=true

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        register-enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:LINKFORGE}
        ip-type: IPv4
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:LINKFORGE}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_IAM_DB:shortlink_iam}
    username: ${POSTGRES_USER:shortlink}
    password: ${POSTGRES_PASSWORD:change-me-pg}

  flyway:
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Kafka 幂等生产者只消除同一 producer session 内部重试产生的重复;
      # Outbox 在 Kafka ACK 后、数据库提交前崩溃仍可能重复,由 Link Inbox 去重。
      properties:
        enable.idempotence: true
        acks: all
        max.in.flight.requests.per.connection: 5

  security:
    oauth2:
      authorizationserver:
        issuer: ${IAM_ISSUER:http://127.0.0.1:8080}

        client:
          link-service:
            registration:
              client-id: linkforge-link-service
              # IAM 保存编码后的密钥；Link 侧持有对应原文。生产环境应使用 {bcrypt} 前缀。
              client-secret: ${IAM_LINK_CLIENT_SECRET_HASH}
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - internal.authorization.read

          smoke-test:
            registration:
              client-id: linkforge-smoke
              # 必须由环境变量提供 PasswordEncoder 格式的密钥，例如 {bcrypt}$2a$...
              client-secret: ${OAUTH_CLIENT_SECRET}

              client-authentication-methods:
                - client_secret_basic

              authorization-grant-types:
                - authorization_code
                - refresh_token

              redirect-uris:
                - http://127.0.0.1:8080/authorized

              scopes:
                - openid
                - profile
                - link.read
                - link.write

            require-proof-key: true
            require-authorization-consent: false

          spa:
            registration:
              client-id: linkforge-spa
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - ${SPA_REDIRECT_URI:http://127.0.0.1:5173/oauth/callback}
                - ${SPA_LOCALHOST_REDIRECT_URI:http://localhost:5173/oauth/callback}
              scopes:
                - openid
                - profile
                - link.read
                - link.write
            require-proof-key: true
            require-authorization-consent: false

management:
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_TRACES_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "
  include-application-name: false

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: io.github.ranpers.linkforge.iam.infrastructure.persistence.mybatis

linkforge:
  security:
    access-token-audience: ${IAM_API_AUDIENCE:linkforge-api}
    signing-key-encryption-key: ${IAM_SIGNING_KEY_ENCRYPTION_KEY}
  outbox:
    # Kafka 是可选 compose profile;默认关闭,避免未启动 Kafka 时误将事件重试至 parked。
    enabled: ${OUTBOX_ENABLED:false}
    topic: ${OUTBOX_TOPIC:linkforge.iam.link-control.v1}
    poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    base-backoff: ${OUTBOX_BASE_BACKOFF:1s}
    max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:10s}
