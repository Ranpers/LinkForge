  /api/v1/links:
    post:
      tags: [Links]
      operationId: createShortLink
      summary: 创建短链
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShortLinkRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: 创建或幂等重放成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShortLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    get:
      tags: [Links]
      operationId: listShortLinks
      summary: 分页查询短链
      parameters:
        - name: createdByUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: shortDomainId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: 短链页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortLinkPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
