openapi: 3.1.0
info:
  title: LinkForge Public API
  version: 1.0.0
  description: >
    Gateway 对外公开的用户、短域名、短链、分组及跳转接口。所有路径都相对于提供本文档的
    网关地址，调用方按实际部署的主机与协议解析，因此这里不声明固定的 servers 条目。
security:
  - bearerAuth: []
tags:
  - name: Users
  - name: ShortDomains
  - name: Links
  - name: Groups
  - name: Security
  - name: Redirect
paths:
  /api/v1/users:
    post:
      tags: [Users]
      operationId: registerUser
      summary: 注册用户
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
        '201':
          description: 注册成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询用户
      parameters:
        - $ref: '#/components/parameters/UserStatus'
        - $ref: '#/components/parameters/UserSearch'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: 用户页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/users/{userId}/security-status:
    patch:
      tags: [Security]
      operationId: changeUserSecurityStatus
      summary: 修改用户安全状态
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserSecurityStatusRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '204':
          description: 修改成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/users/{userId}/link-security-restrictions:
    post:
      tags: [Security]
      operationId: createLinkSecurityRestriction
      summary: 创建用户短链安全限制
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkSecurityRestrictionRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLinkSecurityRestrictionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/users/{userId}/link-security-restrictions/{restrictionId}:
    delete:
      tags: [Security]
      operationId: revokeLinkSecurityRestriction
      summary: 撤销用户短链安全限制
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: restrictionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '204':
          description: 撤销成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/short-domains:
    get:
      tags: [ShortDomains]
      operationId: listShortDomains
      summary: 分页查询短域名
      parameters:
        - name: enabled
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Search128'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: 短域名页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortDomainPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags: [ShortDomains]
      operationId: createShortDomain
      summary: 创建短域名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShortDomainRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortDomain'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/short-domains/{shortDomainId}:
