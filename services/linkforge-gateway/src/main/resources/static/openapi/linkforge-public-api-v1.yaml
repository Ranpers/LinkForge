  /api/v1/links/{linkId}/availability:
    patch:
      tags: [Links]
      operationId: changeShortLinkAvailability
      summary: 修改短链可用状态
      parameters:
        - $ref: '#/components/parameters/LinkId'
      requestBody:
        required: true
        content:
          application/json:
