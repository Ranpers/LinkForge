          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /r/{linkCode}:
    get:
      tags: [Redirect]
      operationId: redirectShortLink
      summary: 解析并跳转短链
      security: []
      parameters:
        - name: linkCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LinkCode'
      responses:
        '307':
          description: 临时重定向至目标地址
          headers:
            Location:
              schema:
                type: string
                format: uri
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: >
        服务端生成的请求关联标识，与问题响应里的 requestId 属性取值相同。
        网关是信任边界，不沿用调用方送来的取值，因此它总是新生成的规范 UUID。
        该标识只用于串联日志与错误响应，与 OpenTelemetry 传播的 traceparent 无关。
      schema:
        type: string
        format: uuid
    RateLimitRemaining:
      description: >
        当前主体在令牌桶中的剩余令牌数，向下取整。取值为 -1 表示限流判定已经降级：
        令牌桶依赖的存储不可用，该取值不反映真实余量。
        本响应头只在成功响应与 429 上保证存在。401 与限流判定未能完成产生的 503 不带它；
        其余错误响应在限流判定已经完成时可能携带，但调用方不得依赖。
      schema:
        type: integer
        format: int64
    RateLimitReplenishRate:
      description: 该路由令牌桶每秒补充的令牌数，即稳态下允许的每秒请求数。
      schema:
        type: integer
        format: int64
    RateLimitBurstCapacity:
      description: 该路由令牌桶允许瞬间消耗的令牌数，即突发容量。
      schema:
        type: integer
        format: int64
    RateLimitRequestedTokens:
      description: 本请求从令牌桶中消耗的令牌数。
      schema:
        type: integer
        format: int64
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShortDomainId:
      name: shortDomainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [DEACTIVATED, ACTIVE, SECURITY_SUSPENDED]
    UserSearch:
      name: q
      in: query
      schema:
        type: string
        maxLength: 64
    Search128:
      name: q
      in: query
      schema:
        type: string
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: 请求参数不合法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 缺少或无法验证访问令牌
      headers:
        WWW-Authenticate:
          schema:
            type: string
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 当前主体无权执行操作
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在或不可用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 当前状态或唯一约束冲突
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: 依赖服务暂时不可用，或限流判定未能完成（后者业务码为 RATE_LIMITER_UNAVAILABLE）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: 路径存在但该 HTTP 方法不受支持
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 超出该主体的请求配额
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Replenish-Rate:
          $ref: '#/components/headers/RateLimitReplenishRate'
        X-RateLimit-Burst-Capacity:
          $ref: '#/components/headers/RateLimitBurstCapacity'
        X-RateLimit-Requested-Tokens:
          $ref: '#/components/headers/RateLimitRequestedTokens'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 服务端未能处理请求
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: 上游服务响应超时
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAcceptable:
      description: >
        无法按客户端 Accept 头生成响应。该响应不携带响应体：触发它的 Accept 头同样约束问题
        响应自身，因此服务端不尝试协商任何媒体类型，调用方只依据状态码判断结果。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    UnsupportedMediaType:
      description: 请求体媒体类型不受支持
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
          format: uuid
        reasonCode:
          type: string
        decisionId:
          type: string
          format: uuid
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9_]{4,64}$'
        password:
          type: string
          minLength: 6
          maxLength: 64
          writeOnly: true
        email:
          type: [string, 'null']
          format: email
          maxLength: 128
    RegisterResponse:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: [string, 'null']
          format: email
    User:
      type: object
      required: [id, username, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: [string, 'null'], format: email}
        realName: {type: [string, 'null']}
        status: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserPage:
      $ref: '#/components/schemas/CursorPageUsers'
    CursorPageUsers:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    ChangeUserSecurityStatusRequest:
      type: object
      required: [suspended]
      properties:
        suspended: {type: boolean}
    CreateLinkSecurityRestrictionRequest:
      type: object
      required: [mode, reasonCode]
      properties:
        mode: {type: string, enum: [ALL, CREATED_DURING]}
        rangeStart: {type: [string, 'null'], format: date-time}
        rangeEnd: {type: [string, 'null'], format: date-time}
        reasonCode: {type: string, minLength: 1, maxLength: 64}
    CreateLinkSecurityRestrictionResponse:
      type: object
      required: [restrictionId]
      properties:
        restrictionId: {type: string, format: uuid}
    CreateShortDomainRequest:
      type: object
      required: [host]
      properties:
        host: {type: string, minLength: 1, maxLength: 253}
        name: {type: [string, 'null'], maxLength: 128}
    UpdateShortDomainRequest:
      type: object
      properties:
        name: {type: [string, 'null'], maxLength: 128}
    AvailabilityRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    ShortDomain:
      type: object
      required: [id, host, enabled, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        host: {type: string}
        name: {type: [string, 'null']}
        enabled: {type: boolean}
        revision: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ShortDomainPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShortDomain'
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}
    LinkCode:
      type: string
      minLength: 4
      maxLength: 32
      pattern: '^[A-Za-z0-9_-]{4,32}$'
      description: 短码；4 到 32 位，只允许字母、数字、下划线和连字符。
    NullableCustomLinkCode:
      type: [string, 'null']
      minLength: 4
      maxLength: 32
      pattern: '^[A-Za-z0-9_-]{4,32}$'
      description: >
        自定义短码；省略时为 null，由系统分配一个 10 位 Base62 短码。
        不区分大小写地拒绝系统保留词：actuator、api、error、health、login、oauth2、
        swagger-ui、v3。
    CreateShortLinkRequest:
      type: object
      required: [name, fullUrl, shortDomainId]
      properties:
        groupId: {type: [string, 'null'], format: uuid}
        name: {type: string, minLength: 1, maxLength: 64}
        linkCode:
          $ref: '#/components/schemas/NullableCustomLinkCode'
        fullUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 绝对 HTTP(S) 目标地址；必须包含主机名，长度不超过 2048。
        sortOrder:
          type: [integer, 'null']
          format: int32
          default: 0
          description: 同组展示排序值；省略时为 null，按 0 处理。取值范围为任意 32 位有符号整数。
        shortDomainId: {type: string, format: uuid}
        expiresAt: {type: [string, 'null'], format: date-time}
    CreateShortLinkResponse:
      type: object
      required: [id, linkCode, shortDomainId, codeType]
      properties:
        id: {type: string, format: uuid}
        linkCode:
          $ref: '#/components/schemas/LinkCode'
        shortDomainId: {type: string, format: uuid}
        codeType: {type: string, enum: [GENERATED, CUSTOM]}
    UpdateLinkTargetRequest:
      type: object
      required: [fullUrl]
      properties:
        fullUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 绝对 HTTP(S) 目标地址；必须包含主机名，长度不超过 2048。
    ShortLink:
      type: object
      required: [id, createdByUserId, name, linkCode, codeType, fullUrl, sortOrder, shortDomainId, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        createdByUserId: {type: string, format: uuid}
        groupId: {type: [string, 'null'], format: uuid}
        name: {type: string}
        linkCode:
          $ref: '#/components/schemas/LinkCode'
        codeType: {type: string}
        fullUrl: {type: string, format: uri}
        sortOrder: {type: integer, format: int32}
        shortDomainId: {type: string, format: uuid}
        status: {type: string}
        disabledReasonCode: {type: [string, 'null']}
        expiresAt: {type: [string, 'null'], format: date-time}
        revision: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ShortLinkPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShortLink'
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        sortOrder:
          type: [integer, 'null']
          minimum: 0
          default: 0
          description: 展示排序提示，须为非负数；省略时为 null，按 0 处理。
    UpdateGroupRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        sortOrder:
          type: [integer, 'null']
          minimum: 0
          description: 新的展示排序提示，须为非负数；省略时为 null，保留原值。
    Group:
      type: object
      required: [id, name, sortOrder, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sortOrder: {type: integer, format: int32}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GroupPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}
