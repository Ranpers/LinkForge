        '204':
          description: 修改成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
