      tags: [ShortDomains]
      operationId: updateShortDomain
      summary: 修改短域名展示信息
      parameters:
        - $ref: '#/components/parameters/ShortDomainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShortDomainRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '204':
          description: 修改成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/short-domains/{shortDomainId}/availability:
    patch:
      tags: [ShortDomains]
      operationId: changeShortDomainAvailability
      summary: 修改短域名可用状态
      parameters:
        - $ref: '#/components/parameters/ShortDomainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '204':
          description: 修改成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Replenish-Rate:
              $ref: '#/components/headers/RateLimitReplenishRate'
            X-RateLimit-Burst-Capacity:
              $ref: '#/components/headers/RateLimitBurstCapacity'
            X-RateLimit-Requested-Tokens:
              $ref: '#/components/headers/RateLimitRequestedTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
